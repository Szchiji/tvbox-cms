name: update-cms

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe CMS endpoints
        run: python update_cms.py
      - name: Commit if changed
        run: |
          git config user.name "tvbox-cms"
          git config user.email "tvbox-cms@users.noreply.github.com"
          git add tvbox_cms.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "auto update cms sites"
            git push
          fi
